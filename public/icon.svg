<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Warm Paper Canvas #FAF9F5 -->
  <rect width="100" height="100" rx="22" fill="#FAF9F5" />
  <rect x="0.5" y="0.5" width="99" height="99" rx="21.5" stroke="#EAE6DF" stroke-width="1" />
  
  <!-- Claude-inspired Cogito Cognition Compass (Anthropic Terracotta #CC785C) -->
  <g transform="translate(50, 50)">
    <!-- Cardinal Petals -->
    <path d="M 0,-28 C 3,-18 5,-8 0,0 C -5,-8 -3,-18 0,-28 Z" fill="#CC785C" />
    <path d="M 0,28 C 3,18 5,8 0,0 C -5,8 -3,18 0,28 Z" fill="#CC785C" />
    <path d="M -28,0 C -18,3 -8,5 0,0 C -8,-5 -18,-3 -28,0 Z" fill="#CC785C" />
    <path d="M 28,0 C 18,3 8,5 0,0 C 8,-5 18,-3 28,0 Z" fill="#CC785C" />
    
    <!-- Diagonal Petals -->
    <g transform="rotate(45)">
      <path d="M 0,-23 C 2.5,-15 4,-6 0,0 C -4,-6 -2.5,-15 0,-23 Z" fill="#CC785C" />
      <path d="M 0,23 C 2.5,15 4,6 0,0 C -4,6 -2.5,15 0,23 Z" fill="#CC785C" />
      <path d="M -23,0 C -15,2.5 -6,4 0,0 C -6,-4 -15,-2.5 -23,0 Z" fill="#CC785C" />
      <path d="M 23,0 C 15,2.5 6,4 0,0 C 6,-4 15,-2.5 23,0 Z" fill="#CC785C" />
    </g>
    
    <!-- Central Hub & Aperture -->
    <circle cx="0" cy="0" r="10" fill="#CC785C" />
    <circle cx="0" cy="0" r="5" fill="#FAF9F5" />
    <circle cx="0" cy="0" r="2.2" fill="#E07A5F" />
  </g>
</svg>
