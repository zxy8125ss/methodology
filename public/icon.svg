<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#grad)" filter="url(#shadow)" />
  <!-- Methodology Glyphs: "方" stylized -->
  <g fill="#ffffff" transform="translate(128, 110) scale(1.1)">
    <!-- Top dot / bar -->
    <path d="M 100 20 L 132 20 C 132 45, 128 65, 120 80 L 92 72 C 98 60, 100 42, 100 20 Z" />
    <!-- Horizontal beam -->
    <rect x="20" y="78" width="192" height="22" rx="8" />
    <!-- Center hook & cross -->
    <path d="M 112 100 L 112 180 C 112 210, 105 225, 80 220 L 72 195 C 88 198, 92 192, 92 175 L 92 100 Z" />
    <!-- Slanted leg -->
    <path d="M 68 115 C 68 150, 52 185, 20 208 L 8 188 C 32 170, 46 142, 46 115 Z" />
    <!-- Right sweeping leg -->
    <path d="M 110 115 C 130 145, 160 178, 205 195 L 192 215 C 145 195, 115 158, 95 125 Z" />
  </g>
</svg>
