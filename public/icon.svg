<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  
  <!-- App Icon Base -->
  <rect width="512" height="512" rx="128" fill="#09090b" />
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#bg)" stroke="#27272a" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Geometric Prism (Cogito Icon) -->
  <g transform="translate(256, 256)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.5))">
    <!-- Isometric Top Rhombus -->
    <polygon points="0,-140 121,-70 0,0 -121,-70" fill="url(#facetTop)" />
    <!-- Isometric Right Rhombus -->
    <polygon points="121,-70 121,70 0,140 0,0" fill="url(#facetRight)" />
    <!-- Isometric Left Rhombus -->
    <polygon points="-121,-70 0,0 0,140 -121,70" fill="url(#facetLeft)" />
    <!-- Inner Portal / Hex Core -->
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="#09090b" stroke="#ffffff" stroke-width="3" stroke-opacity="0.8" />
  </g>
</svg>
