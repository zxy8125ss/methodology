name: Weekly AI Methodology Research

on:
  schedule:
    # 每周一上午 02:00 UTC (北京时间 10:00) 自动触发
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Weekly Deep Research Task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/weekly_research.mjs

      - name: Commit & Create Pull Request for Review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'feat(research): AI weekly methodology research report & review queue'
          title: '🤖 本周 AI 方法论研究成果待审核'
          body: |
            ## 本周 AI 方法论自动研究成果

            - 触发机制：GitHub Actions 每周定时任务
            - 核心原则：**AI 自动研究，入库前由用户审核**
            - 产生内容：
              1. 本周研究成果报告 (`research/reports/`)
              2. 待审核方法论档案草案 (`research/queue/`)
              3. 更新的全局索引 (`indexes/methods-index.json`)

            请在 PWA 端的【AI 研究中心】->【审核队列】中进行一键审核入库。
          branch: 'ai-weekly-research'
          delete-branch: true
